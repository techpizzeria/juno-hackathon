name: flutter_template
description: "Creak - a playful physio-consistency app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.3.1+5

environment:
  sdk: ^3.10.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
#
# Layer notes (see CLAUDE.md + the flutter-app-architecture skill):
#   dio            -> data layer HTTP client (utils/http_client.dart)
#   *_riverpod     -> state management + DI across application/data/presentation
#   json_*         -> domain model serialization
#   shared_prefs   -> local-first repositories
#   flutter_animate -> pinned 4.5.2; all use goes through lib/widgets/app_animations.dart
#   flutter_local_notifications + timezone -> schedule/application/notification_service.dart
dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_animate: 4.5.2
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^19.0.0
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^3.1.0
  flutter_slidable: ^4.0.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^4.0.0
  google_fonts: ^6.2.1
  image_picker: ^1.2.3
  intl: ^0.20.0
  json_annotation: ^4.9.0
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.5.5
  timezone: ^0.10.0
  url_launcher: ^6.3.0
  uuid: ^4.5.0
  video_player: ^2.9.2

# path_provider_foundation >= 2.6 pulls objective_c, whose native build hooks
# break AOT compilation in build_runner and the custom_lint analyzer plugin
# ('dart compile' does not support build hooks). Pin the last hook-free version.
dependency_overrides:
  path_provider_foundation: 2.5.1

# build_runner regenerates *.g.dart for @Riverpod and @JsonSerializable.
# Run `make build-runner` after editing annotated code.
dev_dependencies:
  build_runner: ^2.4.13
  custom_lint: ^0.8.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  import_sorter: ^4.6.0
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0
  riverpod_lint: ^3.0.0
  very_good_analysis: ^10.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Holds LLM_* config read at launch by flutter_dotenv (see AppConfig).
    - .env
    - assets/branding/app_icon/
    - assets/branding/splash/
    - assets/creaky/
    - assets/creaky/home_sunny/
    - assets/creaky/home_sunny/layers/
    - assets/creaky/home_grey/
    - assets/creaky/home_grey/layers/
    - assets/creaky/home_rainy/
    - assets/creaky/home_rainy/layers/
    - assets/creaky/home_stormy/
    - assets/creaky/home_stormy/layers/
    - assets/creaky/success_heart_eyes/
    - assets/creaky/success_heart_eyes/layers/
    - assets/creaky/success_ascent/
    - assets/creaky/success_ascent/layers/
    - assets/creaky/success_high_five/
    - assets/creaky/success_high_five/layers/
    - assets/doodles/
    - assets/exercises.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# https://pub.dev/packages/import_sorter
import_sorter:
  comments: false

# https://pub.dev/packages/flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon/app_icon_1024.png
  adaptive_icon_background: "#FDAFA3"
  adaptive_icon_foreground: assets/branding/app_icon/adaptive_foreground_1024.png
  remove_alpha_ios: true
  background_color_ios: "#FDAFA3"
  min_sdk_android: 21

# https://pub.dev/packages/flutter_native_splash
flutter_native_splash:
  color: "#FFFBFA"
  color_dark: "#FFFBFA"
  color_android: "#FFFBFA"
  color_dark_android: "#FFFBFA"
  color_ios: "#FFFBFA"
  color_dark_ios: "#FFFBFA"
  image: assets/branding/splash/splash_foreground_1024.png
  android: true
  ios: true
  web: false

  android_12:
    color: "#FFFBFA"
    color_dark: "#FFFBFA"
    image: assets/branding/splash/android12_foreground_1152.png
